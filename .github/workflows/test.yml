name: tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'master'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        uses: jdx/mise-action@v3
      - name: Install dependencies
        run: uv sync
      - name: Run lint
        run: uv run pre-commit run --all

  test:
    permissions:
      checks: write
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        uses: jdx/mise-action@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
